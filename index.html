<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radheeka - તાજી શાકભાજી</title>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5fbf4;
  color:#17351c;
}

header{
  background:#286b35;
  color:white;
  padding:30px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:38px;
}

header p{
  margin:10px 0 0;
  font-size:18px;
}

main{
  max-width:650px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
}

.item{
  padding:15px 0;
  border-bottom:1px solid #ddd;
}

.item:last-child{
  border-bottom:none;
}

.veg-name{
  font-size:20px;
  font-weight:bold;
}

.price{
  color:#286b35;
  font-size:18px;
  font-weight:bold;
  margin-top:6px;
}

.stock{
  margin-top:5px;
  font-size:14px;
  color:#555;
}

.out{
  color:#d00000;
  font-weight:bold;
  margin-top:7px;
}

.qty{
  width:130px;
  padding:11px;
  margin-top:10px;
  border:1px solid #aaa;
  border-radius:8px;
  font-size:16px;
}

.customer-input{
  width:100%;
  padding:13px;
  margin-top:7px;
  margin-bottom:12px;
  border:1px solid #aaa;
  border-radius:9px;
  font-size:16px;
}

.total{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  color:#286b35;
}

.loading{
  text-align:center;
  padding:20px;
  color:#666;
}

.error{
  text-align:center;
  padding:15px;
  color:#c00000;
  font-weight:bold;
}

button{
  width:100%;
  padding:17px;
  background:#25D366;
  color:white;
  border:0;
  border-radius:13px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  background:#999;
  cursor:not-allowed;
}

.footer{
  text-align:center;
  color:#666;
  padding:15px 5px;
}
</style>
</head>

<body>

<header>
  <h1>🌿 Radheeka</h1>
  <p>પ્રાકૃતિક ખેતી આધારિત તાજી શાકભાજી</p>
</header>

<main>

<div class="card">
  <h2>🥬 આજની તાજી શાકભાજી</h2>

  <div id="items">
    <div class="loading">
      શાકભાજીની માહિતી લોડ થઈ રહી છે...
    </div>
  </div>
</div>


<div class="card total">
  કુલ રકમ: ₹<span id="total">0</span>
</div>


<div class="card">

  <p><b>તમારું નામ</b></p>
  <input
    class="customer-input"
    id="name"
    type="text"
    placeholder="નામ લખો"
  >

  <p><b>સરનામું / વિસ્તાર</b></p>
  <input
    class="customer-input"
    id="address"
    type="text"
    placeholder="Delivery location"
  >

  <p><b>નોંધ</b></p>
  <input
    class="customer-input"
    id="note"
    type="text"
    placeholder="કોઈ ખાસ સૂચના"
  >

</div>


<button id="orderButton" disabled>
  📲 WhatsApp પર Order મોકલો
</button>


<div class="footer">
  🌿 Fresh • Natural • Direct from Radheeka
</div>

</main>


<script type="module">

/* =========================================
   FIREBASE IMPORT
========================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


/* =========================================
   RADHEEKA FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBeS7ijDjrATL5SYG-e0HyirkuaVZEJYYA",

  authDomain:
  "radheeka-vegetables.firebaseapp.com",

  databaseURL:
  "https://radheeka-vegetables-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
  "radheeka-vegetables",

  storageBucket:
  "radheeka-vegetables.firebasestorage.app",

  messagingSenderId:
  "562547454524",

  appId:
  "1:562547454524:web:d961ccc00e736655220939"

};


/* =========================================
   START FIREBASE
========================================= */

const app = initializeApp(firebaseConfig);

const database = getDatabase(app);


/* =========================================
   ELEMENTS
========================================= */

let vegetables = [];

const items =
document.getElementById("items");

const totalBox =
document.getElementById("total");

const orderButton =
document.getElementById("orderButton");


/* =========================================
   GET VEGETABLES FROM DATABASE
========================================= */

const vegetablesRef =
ref(database,"vegetables");


onValue(

  vegetablesRef,

  (snapshot)=>{

    const data = snapshot.val();

    if(!data){

      vegetables = [];

      items.innerHTML =
      `<div class="loading">
      આજે શાકભાજી ઉપલબ્ધ નથી.
      </div>`;

      totalBox.textContent = "0";

      orderButton.disabled = true;

      return;
    }


    vegetables =
    Object.entries(data).map(([id,value])=>({

      id:id,

      name:
      value.name || "શાકભાજી",

      price:
      Number(value.price) || 0,

      stock:
      Number(value.stock) || 0,

      unit:
      value.unit || "kg"

    }));


    renderVegetables();

    orderButton.disabled = false;

  },

  (error)=>{

    console.error(error);

    items.innerHTML =
    `<div class="error">
    Database સાથે connection થઈ શક્યું નથી.
    </div>`;

    orderButton.disabled = true;

  }

);


/* =========================================
   SHOW VEGETABLES
========================================= */

function renderVegetables(){

  items.innerHTML = "";


  vegetables.forEach((veg,index)=>{

    const div =
    document.createElement("div");

    div.className = "item";


    if(veg.stock <= 0){

      div.innerHTML = `

        <div class="veg-name">
          ${veg.name}
        </div>

        <div class="price">
          ₹${veg.price} / ${veg.unit}
        </div>

        <div class="out">
          OUT OF STOCK
        </div>

      `;

    }

    else{

      const step =
      veg.unit.toLowerCase() === "kg"
      ? "0.25"
      : "1";


      div.innerHTML = `

        <div class="veg-name">
          ${veg.name}
        </div>

        <div class="price">
          ₹${veg.price} / ${veg.unit}
        </div>

        <div class="stock">
          ઉપલબ્ધ: ${veg.stock} ${veg.unit}
        </div>

        <input
          class="qty"
          id="q${index}"
          type="number"
          min="0"
          max="${veg.stock}"
          step="${step}"
          placeholder="Quantity"
        >

        ${veg.unit}

      `;

    }


    items.appendChild(div);

  });


  document
  .querySelectorAll(".qty")
  .forEach(input=>{

    input.addEventListener(
      "input",
      calculateTotal
    );

  });


  calculateTotal();

}


/* =========================================
   CALCULATE TOTAL
========================================= */

function calculateTotal(){

  let total = 0;


  vegetables.forEach((veg,index)=>{

    const input =
    document.getElementById("q"+index);


    if(!input){
      return;
    }


    let quantity =
    parseFloat(input.value) || 0;


    if(quantity < 0){

      quantity = 0;

      input.value = "";

    }


    if(quantity > veg.stock){

      quantity = veg.stock;

      input.value = veg.stock;

      alert(
        veg.name +
        " નો ઉપલબ્ધ Stock માત્ર " +
        veg.stock +
        " " +
        veg.unit +
        " છે."
      );

    }


    total +=
    quantity * veg.price;

  });


  totalBox.textContent =
  formatMoney(total);

}


/* =========================================
   MONEY FORMAT
========================================= */

function formatMoney(value){

  const number =
  Number(value) || 0;

  if(Number.isInteger(number)){
    return number;
  }

  return number.toFixed(2);

}


/* =========================================
   WHATSAPP ORDER
========================================= */

function placeOrder(){

  const selected = [];

  let grandTotal = 0;


  vegetables.forEach((veg,index)=>{

    const input =
    document.getElementById("q"+index);


    if(!input){
      return;
    }


    let quantity =
    parseFloat(input.value) || 0;


    if(quantity > veg.stock){

      quantity = veg.stock;

      input.value = veg.stock;

    }


    if(quantity > 0){

      const amount =
      quantity * veg.price;


      grandTotal += amount;


      selected.push(

        "• " +
        veg.name +
        " - " +
        quantity +
        " " +
        veg.unit +
        " × ₹" +
        veg.price +
        " = ₹" +
        formatMoney(amount)

      );

    }

  });


  if(selected.length === 0){

    alert(
      "ઓછામાં ઓછી એક શાકભાજીની Quantity લખો."
    );

    return;
  }


  const customerName =
  document
  .getElementById("name")
  .value
  .trim();


  const address =
  document
  .getElementById("address")
  .value
  .trim();


  const note =
  document
  .getElementById("note")
  .value
  .trim();


  if(!customerName){

    alert(
      "કૃપા કરીને તમારું નામ લખો."
    );

    return;
  }


  if(!address){

    alert(
      "કૃપા કરીને સરનામું / વિસ્તાર લખો."
    );

    return;
  }


  const message =

  "🌿 *Radheeka Vegetable Order* 🌿\n\n" +

  selected.join("\n") +

  "\n\n💰 *કુલ રકમ: ₹" +
  formatMoney(grandTotal) +
  "*" +

  "\n\n👤 નામ: " +
  customerName +

  "\n📍 સરનામું: " +
  address +

  "\n📝 નોંધ: " +
  (note || "-");


  const whatsappNumber =
  "918758884244";


  const whatsappURL =

  "https://wa.me/" +
  whatsappNumber +
  "?text=" +
  encodeURIComponent(message);


  window.location.href =
  whatsappURL;

}


/* =========================================
   BUTTON
========================================= */

orderButton.addEventListener(
  "click",
  placeOrder
);

</script>

</body>
</html>
