<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Radheeka - તાજી શાકભાજી</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f9f2;
  color:#183c23;
  padding-bottom:115px;
}

header{
  background:linear-gradient(135deg,#1f6b35,#318348);
  color:white;
  text-align:center;
  padding:30px 15px 27px;
}

.logo{
  font-size:38px;
  font-weight:800;
}

.tagline{
  margin-top:8px;
  font-size:17px;
}

main{
  max-width:650px;
  margin:auto;
  padding:18px;
}

.section{
  background:white;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 16px rgba(0,0,0,.07);
}

.title{
  text-align:center;
  font-size:25px;
  font-weight:800;
  margin-bottom:18px;
}

.veg-card{
  border:1px solid #e1ebe2;
  border-radius:16px;
  padding:16px;
  margin-bottom:13px;
  background:#fcfffc;
}

.veg-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.veg-name{
  font-size:21px;
  font-weight:800;
}

.price{
  font-size:18px;
  color:#23763a;
  font-weight:800;
}

.stock{
  margin-top:5px;
  font-size:14px;
  color:#666;
}

.controls{
  display:flex;
  gap:10px;
  align-items:center;
  margin-top:13px;
}

select{
  flex:1;
  padding:12px;
  border:1px solid #b9c8bb;
  border-radius:10px;
  font-size:16px;
  background:white;
}

.line-total{
  min-width:85px;
  text-align:right;
  font-weight:800;
  color:#23763a;
  font-size:17px;
}

.out{
  margin-top:10px;
  color:#d00000;
  font-weight:bold;
}

.customer label{
  display:block;
  margin-top:12px;
  margin-bottom:6px;
  font-weight:bold;
}

.customer input{
  width:100%;
  padding:13px;
  border:1px solid #aaa;
  border-radius:10px;
  font-size:16px;
}

.loading,.error{
  text-align:center;
  padding:20px;
}

.error{
  color:#c00000;
}

.summary{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:10px 14px 12px;
  box-shadow:0 -3px 15px rgba(0,0,0,.12);
  z-index:100;
}

.summary-inner{
  max-width:650px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

.total-box{
  min-width:105px;
}

.total-label{
  font-size:12px;
  color:#666;
}

.total-price{
  font-size:22px;
  color:#23763a;
  font-weight:800;
}

button{
  flex:1;
  border:0;
  background:#25D366;
  color:white;
  padding:15px 10px;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
}

button:disabled{
  background:#aaa;
}

.footer{
  text-align:center;
  color:#6b756c;
  padding:5px 5px 20px;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🌿 Radheeka</div>
  <div class="tagline">
    પ્રાકૃતિક ખેતી આધારિત તાજી શાકભાજી
  </div>
</header>

<main>

<div class="section">

  <div class="title">
    🥬 આજની તાજી શાકભાજી
  </div>

  <div id="items">
    <div class="loading">
      શાકભાજીની માહિતી લોડ થઈ રહી છે...
    </div>
  </div>

</div>


<div class="section customer">

  <div class="title">
    🛒 Delivery Details
  </div>

  <label>તમારું નામ</label>
  <input
    id="name"
    type="text"
    placeholder="નામ લખો"
  >

  <label>સરનામું / વિસ્તાર</label>
  <input
    id="address"
    type="text"
    placeholder="Delivery location"
  >

  <label>નોંધ</label>
  <input
    id="note"
    type="text"
    placeholder="કોઈ ખાસ સૂચના"
  >

</div>


<div class="footer">
🌿 Fresh • Natural • Direct from Radheeka
</div>

</main>


<div class="summary">

  <div class="summary-inner">

    <div class="total-box">
      <div class="total-label">કુલ રકમ</div>
      <div class="total-price">
        ₹<span id="total">0</span>
      </div>
    </div>

    <button id="orderButton" disabled>
      📲 WhatsApp Order
    </button>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey:
  "AIzaSyBeS7ijDjrATL5SYG-e0HyirkuaVZEJYYA",

  authDomain:
  "radheeka-vegetables.firebaseapp.com",

  databaseURL:
  "https://radheeka-vegetables-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
  "radheeka-vegetables",

  storageBucket:
  "radheeka-vegetables.firebasestorage.app",

  messagingSenderId:
  "562547454524",

  appId:
  "1:562547454524:web:d961ccc00e736655220939"

};


const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

let vegetables=[];

const items=document.getElementById("items");
const totalBox=document.getElementById("total");
const orderButton=document.getElementById("orderButton");


/* DATABASE */

onValue(

  ref(database,"vegetables"),

  snapshot=>{

    const data=snapshot.val();

    if(!data){

      vegetables=[];

      items.innerHTML=
      `<div class="loading">
      આજે શાકભાજી ઉપલબ્ધ નથી.
      </div>`;

      orderButton.disabled=true;
      totalBox.textContent="0";

      return;
    }


    vegetables=
    Object.entries(data).map(([id,v])=>({

      id:id,
      name:v.name || "શાકભાજી",
      price:Number(v.price)||0,
      stock:Number(v.stock)||0,
      unit:v.unit || "kg"

    }));


    renderVegetables();
    orderButton.disabled=false;

  },

  error=>{

    console.error(error);

    items.innerHTML=
    `<div class="error">
    Database સાથે connection થઈ શક્યું નથી.
    </div>`;

    orderButton.disabled=true;

  }

);


/* QUANTITY OPTIONS */

function createOptions(veg){

  let html=`<option value="0">Quantity પસંદ કરો</option>`;

  const unit=
  String(veg.unit).toLowerCase();


  /* KG ITEMS */

  if(unit==="kg"){

    const choices=[
      {qty:0.25,label:"250 gm"},
      {qty:0.50,label:"500 gm"},
      {qty:1,label:"1 kg"},
      {qty:1.5,label:"1.5 kg"},
      {qty:2,label:"2 kg"},
      {qty:2.5,label:"2.5 kg"},
      {qty:3,label:"3 kg"},
      {qty:4,label:"4 kg"},
      {qty:5,label:"5 kg"}
    ];


    choices.forEach(c=>{

      if(c.qty<=veg.stock){

        const amount=c.qty*veg.price;

        html+=
        `<option value="${c.qty}">
        ${c.label} — ₹${formatMoney(amount)}
        </option>`;

      }

    });

  }


  /* PUDI ITEMS */

  else{

    const max=
    Math.min(
      Math.floor(veg.stock),
      20
    );


    for(let i=1;i<=max;i++){

      const amount=
      i*veg.price;

      html+=
      `<option value="${i}">
      ${i} ${veg.unit} — ₹${formatMoney(amount)}
      </option>`;

    }

  }


  return html;

}


/* DISPLAY */

function renderVegetables(){

  items.innerHTML="";


  vegetables.forEach((veg,index)=>{

    const card=
    document.createElement("div");

    card.className="veg-card";


    if(veg.stock<=0){

      card.innerHTML=`

      <div class="veg-top">

        <div>
          <div class="veg-name">
            ${veg.name}
          </div>

          <div class="stock">
            હાલમાં ઉપલબ્ધ નથી
          </div>
        </div>

        <div class="price">
          ₹${veg.price}/${veg.unit}
        </div>

      </div>

      <div class="out">
        OUT OF STOCK
      </div>

      `;

    }

    else{

      card.innerHTML=`

      <div class="veg-top">

        <div>

          <div class="veg-name">
            ${veg.name}
          </div>

          <div class="stock">
            ઉપલબ્ધ: ${veg.stock} ${veg.unit}
          </div>

        </div>

        <div class="price">
          ₹${veg.price}/${veg.unit}
        </div>

      </div>


      <div class="controls">

        <select
          id="q${index}"
          data-index="${index}"
        >

          ${createOptions(veg)}

        </select>


        <div
          class="line-total"
          id="line${index}"
        >
          ₹0
        </div>

      </div>

      `;

    }


    items.appendChild(card);

  });


  document
  .querySelectorAll("select[data-index]")
  .forEach(select=>{

    select.addEventListener(
      "change",
      calculateTotal
    );

  });


  calculateTotal();

}


/* TOTAL */

function calculateTotal(){

  let total=0;


  vegetables.forEach((veg,index)=>{

    const select=
    document.getElementById("q"+index);

    const line=
    document.getElementById("line"+index);


    if(!select){
      return;
    }


    const qty=
    Number(select.value)||0;


    const amount=
    qty*veg.price;


    total+=amount;


    if(line){

      line.textContent=
      "₹"+formatMoney(amount);

    }

  });


  totalBox.textContent=
  formatMoney(total);

}


/* MONEY */

function formatMoney(value){

  const n=Number(value)||0;

  if(Number.isInteger(n)){
    return n;
  }

  return n.toFixed(2);

}


/* DISPLAY QUANTITY */

function quantityLabel(veg,qty){

  const unit=
  String(veg.unit).toLowerCase();


  if(unit==="kg"){

    if(qty===0.25){
      return "250 gm";
    }

    if(qty===0.5){
      return "500 gm";
    }

    return qty+" kg";

  }


  return qty+" "+veg.unit;

}


/* ORDER */

function placeOrder(){

  let orderLines=[];
  let grandTotal=0;


  vegetables.forEach((veg,index)=>{

    const select=
    document.getElementById("q"+index);


    if(!select){
      return;
    }


    const qty=
    Number(select.value)||0;


    if(qty>0){

      const amount=
      qty*veg.price;


      grandTotal+=amount;


      orderLines.push(

        "• "+
        veg.name+
        " - "+
        quantityLabel(veg,qty)+
        " × ₹"+
        veg.price+
        "/"+
        veg.unit+
        " = ₹"+
        formatMoney(amount)

      );

    }

  });


  if(orderLines.length===0){

    alert(
      "ઓછામાં ઓછી એક શાકભાજીની Quantity પસંદ કરો."
    );

    return;
  }


  const name=
  document
  .getElementById("name")
  .value
  .trim();


  const address=
  document
  .getElementById("address")
  .value
  .trim();


  const note=
  document
  .getElementById("note")
  .value
  .trim();


  if(!name){

    alert(
      "કૃપા કરીને તમારું નામ લખો."
    );

    return;
  }


  if(!address){

    alert(
      "કૃપા કરીને સરનામું / વિસ્તાર લખો."
    );

    return;
  }


  const message=

  "🌿 *Radheeka Vegetable Order* 🌿\n\n"+

  orderLines.join("\n")+

  "\n\n💰 *કુલ રકમ: ₹"+
  formatMoney(grandTotal)+
  "*"+

  "\n\n👤 નામ: "+
  name+

  "\n📍 સરનામું: "+
  address+

  "\n📝 નોંધ: "+
  (note || "-");


  const whatsappNumber=
  "918758884244";


  window.location.href=

  "https://wa.me/"+
  whatsappNumber+
  "?text="+
  encodeURIComponent(message);

}


orderButton.addEventListener(
  "click",
  placeOrder
);

</script>

</body>
</html>
